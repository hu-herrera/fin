name: Validación LAN y LACP
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/browser.spec.cjs'
      - '.github/workflows/validate-lan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save @playwright/test
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Verificar sintaxis de los tests
        run: node --check tests/browser.spec.cjs
      - name: Validar las sedes y el failover LACP
        run: npx playwright test tests/browser.spec.cjs --browser chromium --reporter=line --trace retain-on-failure
      - name: Guardar rastros de las fallas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lan-fallido
          path: test-results/
          retention-days: 7
