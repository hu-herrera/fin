name: Validacion del simulador
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Probar logica WAN
        run: node tests/wan.test.cjs
      - name: Validar sincronizacion del motor de redundancia Node/navegador
        run: node network/build-browser-lab.cjs --check
      - name: Auditar capacidad IPAM VLAN y puertos de acceso para 23 sedes
        run: node tests/ipam-capacity.test.cjs
      - name: Validar DHCP invitados Palo Alto sin inventar contratos ni direcciones
        run: node tests/guest-dhcp.test.cjs
      - name: Validar migracion DHCP usuarios y telefonia en 23 sedes
        run: node tests/client-dhcp.test.cjs
      - name: Probar redundancia futura StackWise y LACP en 23 sedes
        run: node tests/redundant-model.test.cjs
      - name: Validar plantillas Cisco y PAN-OS propuestas para 23 sedes
        run: node tests/redundant-configs.test.cjs
      - name: Exigir evidencia real antes de aceptar hardware Cisco y Palo Alto
        run: node tests/verify-lab-evidence.test.cjs
      - name: Auditar aislamiento OSPF y políticas NGFW de mínimo privilegio
        run: node tests/security-policy.test.cjs
      - name: Verificar rutas de retorno y permisos exactos DNS NTP entre sedes
        run: node tests/intersite-routing.test.cjs
      - name: Validar aprovisionamiento condicionado de DNS y NTP centrales
        run: node tests/management-services.test.cjs
      - name: Validar TACACS+ AAA y Syslog TLS de equipos por 23 sedes
        run: node tests/netops-services.test.cjs
      - name: Validar generador Cisco IOS-XE WAN IP SLA con rutas /32 por proveedor
        run: node tests/wan-sla-candidate.test.cjs
      - name: Validar prerrequisitos de WAN CGNAT, NAT-T, IPsec y OSPF
        run: node tests/wan-ipsec-readiness.test.cjs
      - name: Validar gestión OOB y Mgmt-vrf independiente en 23 sedes
        run: node tests/oob-management.test.cjs
      - name: Probar simulador en navegador
        run: npx playwright test tests/browser.spec.cjs tests/configuration.spec.cjs tests/redundant-ui.spec.cjs tests/active-topology.spec.cjs --browser chromium --reporter=line --trace retain-on-failure
      - name: Guardar diagnóstico de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostico
          path: test-results/
          if-no-files-found: ignore
