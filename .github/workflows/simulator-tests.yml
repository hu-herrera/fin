name: Validacion del simulador
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Verificar BOM optimizada y comparación económica reproducible
        run: node scripts/build-optimized-proposal.cjs --check
      - name: Verificar parámetros originales y cálculo de carga backup energía TCO
        run: |
          node network/base-sizing.cjs --check
          node tests/base-sizing.test.cjs
      - name: Verificar plano C4 puertos medios dominios de falla y costos
        run: |
          node network/four-wan-design.cjs --check
          node tests/four-wan-design.test.cjs
      - name: Verificar capacidad WAN crecimiento carga exigente y dominios eléctricos
        run: |
          node network/wan-capacity-plan.cjs --check
          node tests/wan-capacity-plan.test.cjs
      - name: Probar logica WAN
        run: node tests/wan.test.cjs
      - name: Probar simulación de paquetes y políticas sobre enlaces
        run: node tests/packet-simulator.test.cjs
      - name: Validar sincronizacion del motor de redundancia Node/navegador
        run: node network/build-browser-lab.cjs --check
      - name: Auditar capacidad IPAM VLAN y puertos de acceso para 23 sedes
        run: node tests/ipam-capacity.test.cjs
      - name: Validar DHCP invitados Palo Alto sin inventar contratos ni direcciones
        run: node tests/guest-dhcp.test.cjs
      - name: Validar migracion DHCP usuarios y telefonia en 23 sedes
        run: node tests/client-dhcp.test.cjs
      - name: Probar redundancia futura StackWise y LACP en 23 sedes
        run: node tests/redundant-model.test.cjs
      - name: Validar plantillas Cisco y PAN-OS propuestas para 23 sedes
        run: node tests/redundant-configs.test.cjs
      - name: Exigir evidencia real antes de aceptar hardware Cisco y Palo Alto
        run: node tests/verify-lab-evidence.test.cjs
      - name: Auditar aislamiento OSPF y políticas NGFW de mínimo privilegio
        run: node tests/security-policy.test.cjs
      - name: Verificar rutas de retorno y permisos exactos DNS NTP entre sedes
        run: node tests/intersite-routing.test.cjs
      - name: Validar aprovisionamiento condicionado de DNS y NTP centrales
        run: node tests/management-services.test.cjs
      - name: Validar TACACS+ AAA y Syslog TLS de equipos por 23 sedes
        run: node tests/netops-services.test.cjs
      - name: Validar acceso administrativo PAN-OS desde una estación controlada
        run: node tests/panos-admin-access.test.cjs
      - name: Validar rutas de servicios originados en PA con MGT preservado
        run: node tests/panos-service-routes.test.cjs
      - name: Auditar bloqueos de certificación real y topología de las 23 sedes
        run: node tests/site-readiness.test.cjs
      - name: Validar permisos financieros de mínimo privilegio por aplicación
        run: node tests/financial-policy.test.cjs
      - name: Validar monitoreo SNMPv3 solo authPriv sin contraseñas en repositorio
        run: node tests/snmpv3-monitoring.test.cjs
      - name: Validar generador Cisco IOS-XE WAN IP SLA con rutas /32 por proveedor
        run: node tests/wan-sla-candidate.test.cjs
      - name: Validar prerrequisitos de WAN CGNAT, NAT-T, IPsec y OSPF
        run: node tests/wan-ipsec-readiness.test.cjs
      - name: Validar gestión OOB y Mgmt-vrf independiente en 23 sedes
        run: node tests/oob-management.test.cjs
      - name: Probar simulador en navegador
        run: npx playwright test tests/browser.spec.cjs tests/configuration.spec.cjs tests/redundant-ui.spec.cjs tests/active-topology.spec.cjs tests/packet-workbench.spec.cjs tests/legacy-baseline.spec.cjs --browser chromium --reporter=line --trace retain-on-failure
      - name: Generar matriz de aceptación por sede para la entrega
        run: node network/site-readiness-report.cjs --json > acceptance-23-sites.json
      - name: Publicar matriz auditada sin secretos en GitHub Actions
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-23-sites
          path: acceptance-23-sites.json
          if-no-files-found: error
      - name: Guardar diagnóstico de fallos
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostico
          path: test-results/
          if-no-files-found: ignore
